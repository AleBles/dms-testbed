# Builds the testbed image and pushes it to GHCR on every push to main (and weekly, so the
# image tracks new DMS, quickshell and compositor releases). Plugin repos pull
# ghcr.io/<owner>/dms-testbed:latest through the CLI; nothing else in this repo ships.
name: publish image

on:
  push:
    branches: [main]
    paths: [Containerfile, "container/**", ".github/workflows/publish.yml"]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lowercase owner)
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dms-testbed" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=DMS + Hyprland/niri/Mango/sway/labwc/Miracle WM nested test rig
