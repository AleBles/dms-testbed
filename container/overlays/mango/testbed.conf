# dms-testbed overlay for Mango. Copied in on every `testbed.sh run`; edit it in the repo.
# The nested output is named WL-1 and is sized by the host window; do not set a custom mode
# (a monitorrule with width/height makes the swapchain test fail and the output never activates).

exec-once=/opt/testbed/overlays/common/testbed-windows.sh

# Spread the test windows over tags so the switcher lists more than one workspace.
windowrule=tags:2,appid:testbed-b
windowrule=tags:3,appid:testbed-c

# Host-safe binds: the host Hyprland owns SUPER combos and the host DMS owns ALT+space.
# Spotlight Focus
bind=CTRL+ALT,space,spawn,dms ipc call spotlight toggleQuery "> "
# Terminal
bind=CTRL+ALT,Return,spawn,foot
bind=CTRL+ALT,1,view,1
bind=CTRL+ALT,2,view,2
bind=CTRL+ALT,3,view,3
bind=CTRL+ALT,q,killclient
